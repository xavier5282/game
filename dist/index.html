<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>চাঁদা দে, নেতা আইছে! — Stage 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap">
  <script type="module" crossorigin src="/assets/index-BC9lcPDU.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-dxV7LTwo.css">
</head>
<body>
<div id="hud">
  <div id="logo" class="box"><b>চাঁদা দে, নেতা আইছে!</b><span>Stage 3 — বাজারের জীবন</span><small id="mission">লক্ষ্য: তিনটি দোকানের কাছে যান (0/3)</small></div>
  <div id="stats" class="box">
    <div id="money">৳0</div>
    <label id="quality-label">গ্রাফিক্স
      <select id="quality" aria-label="Graphics quality">
        <option value="high">উচ্চ</option>
        <option value="medium">মাঝারি</option>
        <option value="low">কম</option>
      </select>
    </label>
    <label id="density-label">পথচারী
      <select id="npc-density" aria-label="Pedestrian density">
        <option value="low">কম</option>
        <option value="normal" selected>মাঝারি</option>
        <option value="high">বেশি</option>
      </select>
    </label>
    <button id="pause">বিরতি (Esc)</button>
  </div>
  <div id="prompt" class="box"></div>
  <div id="character-status" role="status" aria-live="polite"></div>
  <div id="market-status" role="status" aria-live="polite"></div>
  <div id="hint" class="box">W A S D চলুন · Shift দৌড় · Space লাফ · E আলাপ · ডান ক্লিক টেনে ক্যামেরা ঘোরান</div>
  <div id="joy"><i></i></div>
</div>
<div id="menu"><div>
  <h1 id="mtitle">চাঁদা দে, নেতা আইছে!</h1>
  <p id="mtext">কাল্পনিক বাজার ঘুরে দেখুন, পথচারীদের সঙ্গে কথা বলুন এবং দোকানদারদের সঙ্গে পরিচিত হোন।</p>
  <button id="go">খেলা শুরু</button>
</div></div>
</body>
</html>
